# Deploys the prototype's installable app to GitHub Pages on every push to main, after the checks pass (backlog #34):
# apps/prototype/scripts/build-app.js inlines the engine from packages/engine and wraps the page with its manifest,
# offline worker and icons. The new application (apps/web) deploys to Vercel instead (architecture v2).
# Public URL: https://xreosteel.github.io/xstruc/
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # to see GitHub's own branch build (below)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Tests and type checks (every package, through Turborepo)
        run: pnpm test
      - name: Builds (the prototype page and the web app, with no keys set)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Browser test of the web app's 3D demo (headless Chromium, software WebGL)
        run: |
          pnpm --filter @xstruc/web exec playwright install --with-deps chromium
          pnpm --filter @xstruc/web e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is also set to build from the branch: GitHub's own "pages build and deployment" run deploys the raw repo
      # on every push too, and the last deploy wins. Wait for it so the app (manifest, worker, icons) is what stays live.
      # Settings > Pages > Source "GitHub Actions" stops that run; this step then finds none and goes straight on.
      - name: Wait for the branch build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            s=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA" --jq '[.workflow_runs[] | select(.path | startswith("dynamic/pages/"))][0].status // ""' 2>/dev/null || true)
            if [ "$s" = "completed" ]; then echo "branch build finished"; sleep 5; break; fi
            if [ -z "$s" ] && [ "$i" -ge 4 ]; then echo "no branch build for this commit"; break; fi
            echo "branch build: ${s:-not started}"; sleep 10
          done
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the prototype app (engine bundled from packages/engine with esbuild)
        run: node apps/prototype/scripts/build-app.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
